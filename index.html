<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c2c"><title>NIGHT DISTRICT | 万葉市 α0.4</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#f1f5fb;background:#091321}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0a1425,#152338 55%,#091322);min-height:100vh}button,select{font:inherit}button{cursor:pointer}.wrap{max-width:880px;margin:auto;padding:18px 14px 52px}header{display:flex;justify-content:space-between;align-items:start;gap:10px}h1{font-size:26px;letter-spacing:2px;margin:0}.sub{color:#aebdd3;font-size:12px}.pill{border:1px solid #60738a;border-radius:20px;padding:5px 9px;font-size:11px;color:#cee9fc}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat,.panel{background:#16263b;border:1px solid #32475f;border-radius:14px;padding:12px}.stat small{display:block;color:#a9bfd2;font-size:11px}.stat strong{display:block;font-size:17px;white-space:nowrap;margin-top:6px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;background:#1d3047;border:1px solid #536b84;color:#fff;border-radius:10px;padding:11px}.tabs button.on{background:#436789;border-color:#add5eb}.map{position:relative;background:#102334;border:1px solid #46607b;border-radius:14px;overflow:hidden}.map svg{display:block;width:100%;height:auto}.block{cursor:pointer;transition:filter .15s}.block:focus{outline:none}.block:hover{filter:brightness(1.35)}.block.selected rect{stroke:#ffcf73;stroke-width:4}.block rect{stroke:#7897a5;stroke-width:1.5}.block text{pointer-events:none;font-size:12px;font-weight:650;fill:#f3f7ff;text-anchor:middle}.road{stroke:#607887;stroke-width:29;stroke-linecap:round;fill:none}.roadmark{stroke:#c3cad0;stroke-width:1.5;stroke-dasharray:7 8;fill:none}.river{stroke:#1f6a89;stroke-width:21;fill:none}.district{font-size:16px;fill:#ffda9b;font-weight:750;letter-spacing:1px}.tag{font-size:10px;fill:#bfd4e3}.panel{margin-top:12px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.label{color:#aac2d6;font-size:13px}.headline{font-size:19px;font-weight:750;margin:4px 0}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}button.action{background:#325f7e;color:#fff;border:1px solid #7196ad;border-radius:10px;padding:12px 7px;font-size:13px}.action.secondary{background:#263b54}.action.danger{background:#603d46}.action:disabled{opacity:.35;cursor:not-allowed}.log{color:#eacb93;font-size:13px;min-height:30px;margin:12px 0 0}.muted{font-size:12px;color:#b4c4d5;line-height:1.6}.highlight{color:#8fe0bd}.bar{height:7px;border-radius:9px;background:#354b64;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:#81caaa}.toolrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}.toolrow select{background:#20384f;color:white;border:1px solid #63809c;border-radius:8px;padding:9px}.toolrow button{background:#22384e;border:1px solid #5c7992;color:#f4f7fb;border-radius:8px;padding:9px}.hidden{display:none}.foot{margin-top:15px;color:#91a6bb;font-size:11px;line-height:1.6}.night-glow{filter:drop-shadow(0 0 4px #ebb66988)}.day .map{background:#7198a1}.day .district{fill:#152c39}.day .tag{fill:#133d52}.day .road{stroke:#aebbbd}.day .roadmark{stroke:#fff}#toast{background:#273f55;border-radius:10px;padding:10px;margin-top:12px;font-size:13px}button:focus-visible,.block:focus-visible{outline:3px solid #ffd98a;outline-offset:2px}@media(max-width:420px){h1{font-size:22px}.stat{padding:9px}.stat strong{font-size:15px}.district{font-size:14px}}
</style></head><body><main class="wrap" id="app"><header><div><h1>NIGHT DISTRICT</h1><div class="sub">万葉市 — 夜の街、再生計画</div></div><div class="pill">α Ver.0.4</div></header><section class="stats"><div class="stat"><small>企業資金</small><strong id="cash"></strong></div><div class="stat"><small>行政予算</small><strong id="city"></strong></div><div class="stat"><small>純利益 / 1時間</small><strong id="rate"></strong></div></section><div class="tabs"><button id="privateTab" onclick="setRole('private')">🏢 経営者</button><button id="cityTab" onclick="setRole('city')">🏛️ 市長</button></div><div class="row" style="margin:8px 2px 12px"><div><div id="date" class="label"></div><div id="season" class="muted"></div></div><button class="action secondary" onclick="toggleDay()" id="dayBtn">☀️ 昼表示</button></div><div class="map" id="map"><svg viewBox="0 0 650 540" role="img" aria-label="万葉市の模式マップ。各建物をタップして開発します"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#b1d6dd" stroke-opacity=".09"/></pattern></defs><rect width="650" height="540" fill="url(#grid)"/><path class="road" d="M 110 70 L 555 70 L 560 385 L 95 385 L 110 70 M 315 70 L 315 385 M 110 225 L560 225 M 60 478 L 615 478"/><path class="roadmark" d="M 110 70 L 555 70 L 560 385 L 95 385 L 110 70 M315 70 L315 385 M110 225 L560 225 M60 478 L615 478"/><g id="blocks"></g><text class="district" x="26" y="26">桐影町</text><text class="district" x="336" y="26">御灯屋町</text><text class="district" x="27" y="267">末灯町</text><text class="district" x="335" y="267">万葉駅前</text><text class="tag" x="15" y="524">※架空の配置・縮尺なし／現実の道路や建物の形ではありません</text><text class="tag" x="610" y="23" text-anchor="end">北 ↑</text><text class="tag" x="316" y="460">万葉線モデル　🚃</text></svg></div><section class="panel"><div class="label" id="zone"></div><div class="headline" id="name"></div><div class="row"><span id="type" class="pill"></span><span class="label" id="level"></span></div><p class="muted" id="desc"></p><div class="actions" id="actions"></div><div id="toast" aria-live="polite"></div></section><section class="panel"><div class="row"><strong>街の経営状況</strong><span class="label" id="dayCount"></span></div><div class="row" style="margin-top:13px"><span class="label">街の活気</span><span id="popularity"></span></div><div class="bar"><div id="popBar"></div></div><div class="row" style="margin-top:13px"><span class="label">営業店舗</span><strong id="shops"></strong></div><div class="row" style="margin-top:8px"><span class="label">空き区画</span><strong id="vacants"></strong></div><div class="row" style="margin-top:8px"><span class="label">経過放置時間</span><strong id="away"></strong></div><div class="toolrow"><button onclick="simulateDay()">▶ 1日進める（試験用）</button><button onclick="exportSave()">💾 バックアップ出力</button><button onclick="document.getElementById('importFile').click()">📂 復元</button><input type="file" id="importFile" accept="application/json" class="hidden" onchange="importSave(event)"></div></section><section class="panel"><strong>季節イベント</strong><p id="event" class="muted"></p><p class="muted">端末の日本時間を参照。営業時間の詳細・実際の天候・祝日・公式祭事日程との照合は今後の実装予定。</p></section><div class="foot">この版は操作・保存機能を試す独立型プロトタイプ。地図は概念図で、実際の高岡の建物・街路は未使用です。セーブはこのブラウザのローカル保存領域に依存し、ブラウザ設定や閲覧方法によって保持されない場合があります。バックアップ出力をおすすめします。 © NIGHT DISTRICT prototype.</div></main><script>
const KEY='night-district-v04';const initial=[{id:0,x:123,y:91,w:175,h:112,name:'夜桜バー',zone:'桐影町',kind:'direct',lv:1,emoji:'🍷'},{id:1,x:336,y:91,w:200,h:112,name:'旧商業ビル',zone:'御灯屋町',kind:'vacant',lv:0,emoji:'🏢'},{id:2,x:121,y:248,w:173,h:108,name:'空き店舗',zone:'末灯町',kind:'vacant',lv:0,emoji:'🏚️'},{id:3,x:334,y:246,w:98,h:107,name:'駅前ホテル',zone:'万葉駅前',kind:'tenant',lv:1,emoji:'🏨'},{id:4,x:450,y:247,w:89,h:106,name:'万葉駅',zone:'万葉駅前',kind:'public',lv:1,emoji:'🚉'},{id:5,x:121,y:405,w:173,h:46,name:'居酒屋',zone:'末灯町',kind:'direct',lv:1,emoji:'🏮'},{id:6,x:338,y:407,w:198,h:42,name:'駅前広場',zone:'万葉駅前',kind:'public',lv:1,emoji:'🌳'}];const clone=x=>JSON.parse(JSON.stringify(x));let state={buildings:clone(initial),cash:2500,city:4000,selected:1,role:'private',pop:43,days:1,last:Date.now(),away:0},dayView=false;const yen=n=>Math.round(n).toLocaleString('ja-JP')+'万円';const kindText={direct:'直営',tenant:'テナント',vacant:'空き物件',land:'更地',public:'公共施設'};const income=b=>b.kind==='direct'?3.2*b.lv:b.kind==='tenant'?2*b.lv:b.kind==='vacant'?-0.25:0;const profit=()=>state.buildings.reduce((s,b)=>s+income(b),0);function save(){state.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){say('保存に失敗しました。バックアップ出力を利用してください。')}}function say(msg){document.getElementById('toast').textContent=msg}function load(){try{const p=JSON.parse(localStorage.getItem(KEY));if(p&&Array.isArray(p.buildings)&&typeof p.last==='number'){state={...state,...p};const elapsed=Math.max(0,Math.min(Date.now()-p.last,24*60*60*1000));const earned=profit()*elapsed/3600000;state.cash=Math.round((state.cash+earned)*100)/100;state.away=elapsed/3600000;save();say('おかえり！不在中の収支 '+(earned>=0?'+':'')+yen(earned)+'（最大24時間）');return}}catch(e){}say('御灯屋町の旧商業ビルから再開発を始めよう！')}function renderMap(){let svg=document.getElementById('blocks');svg.innerHTML='';state.buildings.forEach(b=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','block'+(b.id===state.selected?' selected':''));g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',b.zone+' '+b.name);const color={direct:'#375c6a',tenant:'#365d54',vacant:'#4e4f5f',land:'#795b3e',public:'#3b6076'}[b.kind];g.innerHTML=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="9" fill="${color}"/><text x="${b.x+b.w/2}" y="${b.y+b.h/2-5}">${b.emoji}</text><text x="${b.x+b.w/2}" y="${b.y+b.h/2+17}">${b.name}</text>`;g.addEventListener('click',()=>{state.selected=b.id;save();render()});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();state.selected=b.id;save();render()}});svg.appendChild(g)})}function addAction(text,fn,enabled=true,cls=''){const btn=document.createElement('button');btn.className='action '+cls;btn.textContent=text;btn.disabled=!enabled;btn.onclick=fn;document.getElementById('actions').appendChild(btn)}function update(building){state.buildings[state.selected]={...state.buildings[state.selected],...building};save();render()};function charge(n){if(state.cash<n)return false;state.cash-=n;return true}function doRenovate(kind){if(!charge(350))return;update({kind,lv:1,emoji:kind==='direct'?'🏮':'🏬',name:kind==='direct'?'再生直営店':'再生テナント'});state.pop=Math.min(100,state.pop+3);save();render();say('改修完了！ '+yen(350)+'を支出。')}function doDemolish(){if(!confirm('この建物を解体して更地にしますか？（180万円）'))return;if(!charge(180))return;update({kind:'land',lv:0,emoji:'🟫',name:'更地'});say('解体完了。新しい施設を建てられるよ。')}function doBuild(kind){const costs={direct:550,tenant:450};if(!charge(costs[kind]))return;update({kind,lv:1,emoji:kind==='direct'?'🍜':'🏬',name:kind==='direct'?'新しい飲食店':'新しいテナント'});state.pop=Math.min(100,state.pop+2);save();render();say('建設完了！')}function doUpgrade(){let b=state.buildings[state.selected],cost=b.lv*250;if(!charge(cost))return;update({lv:b.lv+1});say('設備レベルアップ！')}function doCity(which){const cost=which==='景観整備'?400:600;if(state.city<cost)return;state.city-=cost;state.pop=Math.min(100,state.pop+(which==='景観整備'?7:10));save();render();say(which+'が完了したよ。')}function setRole(r){state.role=r;save();render()}function toggleDay(){dayView=!dayView;render()}function render(){renderMap();document.getElementById('app').classList.toggle('day',dayView);document.getElementById('dayBtn').textContent=dayView?'🌙 夜表示':'☀️ 昼表示';document.getElementById('privateTab').classList.toggle('on',state.role==='private');document.getElementById('cityTab').classList.toggle('on',state.role==='city');document.getElementById('cash').textContent=yen(state.cash);document.getElementById('city').textContent=yen(state.city);document.getElementById('rate').textContent=(profit()>=0?'+':'')+yen(profit());let b=state.buildings[state.selected];document.getElementById('zone').textContent=b.zone;document.getElementById('name').textContent=b.emoji+' '+b.name;document.getElementById('type').textContent=kindText[b.kind];document.getElementById('level').textContent=b.lv?'Lv.'+b.lv:'';document.getElementById('desc').textContent=b.kind==='vacant'?'改修して店舗にするか、解体して建て替えよう。':b.kind==='land'?'新しい施設を建てられる土地。':b.kind==='public'?'市が管理する公共・交通施設。':'現在の収支 '+(income(b)>=0?'+':'')+yen(income(b))+'/時';document.getElementById('actions').innerHTML='';if(state.role==='city'){addAction('景観整備 400万円',()=>doCity('景観整備'),state.city>=400);addAction('歩行環境整備 600万円',()=>doCity('歩行環境整備'),state.city>=600)}else if(b.kind==='vacant'){addAction('直営へ改修 350万円',()=>doRenovate('direct'),state.cash>=350);addAction('テナントへ改修 350万円',()=>doRenovate('tenant'),state.cash>=350);addAction('解体 180万円',doDemolish,state.cash>=180,'danger')}else if(b.kind==='land'){addAction('飲食店建設 550万円',()=>doBuild('direct'),state.cash>=550);addAction('テナント建設 450万円',()=>doBuild('tenant'),state.cash>=450)}else if(b.kind==='direct'||b.kind==='tenant'){addAction('設備強化 '+yen(250*b.lv),doUpgrade,state.cash>=250*b.lv);addAction('経営方式切替',()=>{update({kind:b.kind==='direct'?'tenant':'direct'});say('直営・賃貸を切り替えたよ（試験用）。')},true,'secondary');addAction('解体 180万円',doDemolish,state.cash>=180,'danger')}else{addAction('市長モードで整備',()=>setRole('city'),true,'secondary')};document.getElementById('popularity').textContent=state.pop+'/100';document.getElementById('popBar').style.width=state.pop+'%';document.getElementById('shops').textContent=state.buildings.filter(b=>['direct','tenant'].includes(b.kind)).length+'軒';document.getElementById('vacants').textContent=state.buildings.filter(b=>b.kind==='vacant').length+'軒';document.getElementById('dayCount').textContent='ゲーム内 Day '+state.days;document.getElementById('away').textContent=(state.away||0).toFixed(1)+'時間';const now=new Date(),japan=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Tokyo'})),m=japan.getMonth()+1;document.getElementById('date').textContent=`現実の暦：${japan.getFullYear()}年${m}月${japan.getDate()}日`;const seasons=['冬','冬','春','春','春','夏','夏','夏','秋','秋','秋','冬'];document.getElementById('season').textContent=seasons[m-1]+'の万葉市';const events={1:'新年会需要。雪への備えで交通整備が重要。',2:'冬の低需要期。固定費に注意。',3:'歓送迎会シーズンの始まり。',4:'春の観光・歓送迎会需要。',5:'御車山祭を参考にした文化イベント月。',6:'梅雨の雨対策で歩行環境を改善。',7:'夏の夜市や屋外飲食の季節。',8:'七夕イベント月。駅前からの人流増を演出。',9:'秋の夜長。文化・飲食イベント。',10:'万葉をテーマにした文化イベント月。',11:'忘年会の準備シーズン。',12:'忘年会需要と降雪対策の両立。'};document.getElementById('event').textContent=events[m]+' ※イベントは架空のゲーム効果であり実際の開催日ではありません。'}function simulateDay(){let earnings=profit()*24;state.cash=Math.round((state.cash+earnings)*100)/100;state.city+=50;state.days++;save();render();say('営業を1日進めたよ。純利益 '+(earnings>=0?'+':'')+yen(earnings)+'。行政収入 +50万円。')}function exportSave(){save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='night-district-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);say('セーブデータをファイルに書き出したよ。')}async function importSave(ev){try{const f=ev.target.files[0];if(!f)return;let p=JSON.parse(await f.text());if(!Array.isArray(p.buildings)||typeof p.cash!=='number'||typeof p.city!=='number'||p.buildings.length!==initial.length)throw Error('不正なセーブデータ');state={...state,...p,last:Date.now(),away:0};save();render();say('バックアップを復元したよ。')}catch(e){say('読み込めませんでした。Ver.0.4の保存データを選んでね。')}ev.target.value=''}load();render();document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{let p;try{p=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(p&&p.last){const hrs=Math.min(Math.max((Date.now()-p.last)/3600000,0),24);if(hrs>.001){state.cash+=profit()*hrs;state.away=hrs;save();render();say('戻ってきたね！放置収益 '+yen(profit()*hrs))}}}});
</script></body></html>
